apiVersion: apps/v1
kind: Deployment
metadata:
  name: homework-deployment
  namespace: homework
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homework
  template:
    metadata:
      labels:
        app: homework
    spec:
      volumes:
        - name: shared-volume
          persistentVolumeClaim:
            claimName: homework-pvc
      serviceAccountName: crd
      containers:
        - name: main-container
          image: roflmaoinmysoul/mysql-operator:1.0.0
